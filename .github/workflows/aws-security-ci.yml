name: AWS security portfolio validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline application tests, mutations and Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and validate source
        run: |
          python -m compileall -q projects tests validation scripts
          python validation/validate_portfolio.py
      - name: Exercise offline behavior, mutations, coverage and Bandit
        run: python validation/run_evidence.py
      - name: Verify interactive control explorer is faithful to original register
        run: python -m pytest -q tests/test_architecture_explorer.py tests/test_release_integrity.py
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aws-security-offline-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/execution.json
            reports/pytest.txt
            reports/repository-checks.json
            reports/bandit.json
            reports/mutations.json
            reports/coverage.json
            reports/junit.xml
            demo/security-controls.html

  terraform:
    name: Terraform provider validation and mock tests (four roots)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Terraform 1.9.8
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Validate and mock-test all four independent roots without AWS credentials
        env:
          TF_IN_AUTOMATION: 'true'
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          for root in projects/*/iac/terraform; do
            echo "::group::${root}"
            terraform -chdir="${root}" fmt -check -recursive
            terraform -chdir="${root}" init -backend=false -input=false -no-color
            test -s "${root}/.terraform.lock.hcl"
            terraform -chdir="${root}" validate -no-color
            terraform -chdir="${root}" test -no-color
            echo "::endgroup::"
          done

  secrets:
    name: Gitleaks committed-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Gitleaks binary
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Scan all reachable history
        run: /tmp/gitleaks git . --redact --no-banner
