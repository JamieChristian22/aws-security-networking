<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1200" height="830" fill="#f4f7fb"/><rect width="1200" height="112" fill="#102238"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="bold">01  SEGMENTED NETWORK CORE</text><text x="40" y="82" fill="#a9c6df" font-family="Arial" font-size="15">Forward egress shown below; return traffic crosses the same-AZ firewall before returning through TGW</text><rect x="40" y="145" width="260" height="96" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="145" width="6" height="96" rx="3" fill="#0f766e"/><text x="58" y="174" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Spoke VPCs</text><text x="58" y="198" font-family="Arial" font-size="13" fill="#475569">Dev / Prod / Shared</text><text x="58" y="217" font-family="Arial" font-size="13" fill="#475569">Private subnets; no public IPs</text><rect x="430" y="145" width="340" height="96" rx="10" fill="white" stroke="#cbd5e1"/><rect x="430" y="145" width="6" height="96" rx="3" fill="#0f766e"/><text x="448" y="174" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Transit Gateway</text><text x="448" y="198" font-family="Arial" font-size="13" fill="#475569">Spoke table: explicit blackholes</text><text x="448" y="217" font-family="Arial" font-size="13" fill="#475569">Default route → inspection</text><path d="M300,193 L430,193" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="365.0" y="183.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">default route</text><text x="830" y="177" font-family="Arial" font-size="19" fill="#b91c1c" text-anchor="start">Cross-spoke: DENIED</text><text x="830" y="205" font-family="Arial" font-size="14" fill="#475569" text-anchor="start">No implicit propagation</text><rect x="40" y="285" width="1120" height="185" rx="12" fill="#e8eef6" stroke="#c2d0df" stroke-dasharray="6 4"/><text x="56" y="311" font-family="Arial" font-size="14" fill="#24445f" text-anchor="start">AZ A  |  INSPECTION VPC</text><rect x="65" y="340" width="225" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="65" y="340" width="6" height="82" rx="3" fill="#0f766e"/><text x="83" y="369" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">TGW subnet</text><text x="83" y="393" font-family="Arial" font-size="13" fill="#475569">Dedicated steering tier</text><rect x="350" y="340" width="235" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="350" y="340" width="6" height="82" rx="3" fill="#0f766e"/><text x="368" y="369" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Firewall endpoint</text><text x="368" y="393" font-family="Arial" font-size="13" fill="#475569">Stateful TCP/443 policy</text><rect x="645" y="340" width="225" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="645" y="340" width="6" height="82" rx="3" fill="#0f766e"/><text x="663" y="369" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">NAT gateway</text><text x="663" y="393" font-family="Arial" font-size="13" fill="#475569">Dedicated public tier</text><rect x="930" y="340" width="205" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="930" y="340" width="6" height="82" rx="3" fill="#0f766e"/><text x="948" y="369" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Shared IGW</text><text x="948" y="393" font-family="Arial" font-size="13" fill="#475569">Same VPC internet edge</text><path d="M290,381 L350,381" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M585,381 L645,381" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M870,381 L930,381" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="451" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">Return: NAT subnet → firewall endpoint → TGW → original spoke. AZ endpoint selection is explicit.</text><rect x="40" y="500" width="1120" height="185" rx="12" fill="#e8eef6" stroke="#c2d0df" stroke-dasharray="6 4"/><text x="56" y="526" font-family="Arial" font-size="14" fill="#24445f" text-anchor="start">AZ B  |  INSPECTION VPC</text><rect x="65" y="555" width="225" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="65" y="555" width="6" height="82" rx="3" fill="#0f766e"/><text x="83" y="584" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">TGW subnet</text><text x="83" y="608" font-family="Arial" font-size="13" fill="#475569">Dedicated steering tier</text><rect x="350" y="555" width="235" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="350" y="555" width="6" height="82" rx="3" fill="#0f766e"/><text x="368" y="584" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Firewall endpoint</text><text x="368" y="608" font-family="Arial" font-size="13" fill="#475569">Stateful TCP/443 policy</text><rect x="645" y="555" width="225" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="645" y="555" width="6" height="82" rx="3" fill="#0f766e"/><text x="663" y="584" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">NAT gateway</text><text x="663" y="608" font-family="Arial" font-size="13" fill="#475569">Dedicated public tier</text><rect x="930" y="555" width="205" height="82" rx="10" fill="white" stroke="#cbd5e1"/><rect x="930" y="555" width="6" height="82" rx="3" fill="#0f766e"/><text x="948" y="584" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Shared IGW</text><text x="948" y="608" font-family="Arial" font-size="13" fill="#475569">Same VPC internet edge</text><path d="M290,596 L350,596" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M585,596 L645,596" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M870,596 L930,596" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="666" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">Return: NAT subnet → firewall endpoint → TGW → original spoke. AZ endpoint selection is explicit.</text><path d="M600,241 L600,262 L25,262 L25,596 L65,596" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M25,381 L65,381" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="733" font-family="Arial" font-size="14" fill="#475569" text-anchor="start">Telemetry: VPC Flow Logs + Network Firewall flow/alert logs. DNS resolver traffic is outside this egress filter.</text><text x="40" y="795" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">No live reachability or availability claim. Test both AZs, prohibited ports, return routing and cross-spoke denial.</text></svg>