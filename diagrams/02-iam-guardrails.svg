<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1200" height="800" fill="#f4f7fb"/><rect width="1200" height="112" fill="#102238"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="bold">02  IAM GUARDRAILS</text><text x="40" y="82" fill="#a9c6df" font-family="Arial" font-size="15">Identity policies grant access within boundaries; explicit denies and other applicable policies still constrain it</text><rect x="40" y="160" width="290" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="160" width="6" height="94" rx="3" fill="#7c3aed"/><text x="58" y="189" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Trusted operator roles</text><text x="58" y="213" font-family="Arial" font-size="13" fill="#475569">Exact principal ARNs</text><text x="58" y="232" font-family="Arial" font-size="13" fill="#475569">Temporary STS sessions</text><rect x="445" y="160" width="310" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="445" y="160" width="6" height="94" rx="3" fill="#7c3aed"/><text x="463" y="189" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Routine roles</text><text x="463" y="213" font-family="Arial" font-size="13" fill="#475569">Auditor / Investigator / Deployer</text><text x="463" y="232" font-family="Arial" font-size="13" fill="#475569">No IAM mutation</text><path d="M330,207 L445,207" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="387.5" y="197.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">AssumeRole</text><rect x="445" y="315" width="310" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="445" y="315" width="6" height="94" rx="3" fill="#7c3aed"/><text x="463" y="344" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Permissions boundary</text><text x="463" y="368" font-family="Arial" font-size="13" fill="#475569">Explicit allow envelope</text><text x="463" y="387" font-family="Arial" font-size="13" fill="#475569">Escalation + security-change deny</text><path d="M600,254 L600,315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="875" y="235" width="280" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="875" y="235" width="6" height="94" rx="3" fill="#7c3aed"/><text x="893" y="264" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Approved operations</text><text x="893" y="288" font-family="Arial" font-size="13" fill="#475569">Read inventory and findings</text><text x="893" y="307" font-family="Arial" font-size="13" fill="#475569">Scoped existing Lambda updates</text><path d="M755,362 L875,282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="815.0" y="312.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">evaluate</text><rect x="40" y="475" width="290" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="475" width="6" height="94" rx="3" fill="#b91c1c"/><text x="58" y="504" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Emergency IAM users</text><text x="58" y="528" font-family="Arial" font-size="13" fill="#475569">Named identities + MFA age</text><text x="58" y="547" font-family="Arial" font-size="13" fill="#475569">Custody and approval procedure</text><rect x="445" y="475" width="310" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="445" y="475" width="6" height="94" rx="3" fill="#b91c1c"/><text x="463" y="504" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Break-glass role</text><text x="463" y="528" font-family="Arial" font-size="13" fill="#475569">AdministratorAccess</text><text x="463" y="547" font-family="Arial" font-size="13" fill="#475569">Maximum 1-hour session</text><path d="M330,522 L445,522" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="387.5" y="512.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">MFA required</text><rect x="875" y="475" width="280" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="875" y="475" width="6" height="94" rx="3" fill="#2563eb"/><text x="893" y="504" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Audit + notifications</text><text x="893" y="528" font-family="Arial" font-size="13" fill="#475569">CloudTrail → S3 + Logs</text><text x="893" y="547" font-family="Arial" font-size="13" fill="#475569">Metric filters → SNS</text><path d="M755,522 L875,522" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="815.0" y="512.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">monitor</text><rect x="40" y="630" width="1115" height="80" rx="12" fill="#e8eef6" stroke="#c2d0df" stroke-dasharray="6 4"/><text x="56" y="656" font-family="Arial" font-size="14" fill="#24445f" text-anchor="start">OPTIONAL ORGANIZATION LAYER</text><text x="58" y="683" font-family="Arial" font-size="15" fill="#475569" text-anchor="start">Sandbox SCP only when a reviewed target is supplied. No target = no SCP creation or attachment.</text><text x="40" y="765" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">The shipped incident role is read-only. Emergency role approval is an operating procedure, not an automated workflow.</text></svg>