<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1200" height="825" fill="#f4f7fb"/><rect width="1200" height="112" fill="#102238"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="bold">03  PRIVATE DETECTION PIPELINE</text><text x="40" y="82" fill="#a9c6df" font-family="Arial" font-size="15">Raw finding versions are archived before indexing; errors remain visible through retries and failure queues</text><rect x="40" y="155" width="285" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="155" width="6" height="94" rx="3" fill="#2563eb"/><text x="58" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">GuardDuty / Security Hub</text><text x="58" y="208" font-family="Arial" font-size="13" fill="#475569">Account and region ownership</text><text x="58" y="227" font-family="Arial" font-size="13" fill="#475569">Imported finding events</text><rect x="440" y="155" width="300" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="440" y="155" width="6" height="94" rx="3" fill="#2563eb"/><text x="458" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">EventBridge rules</text><text x="458" y="208" font-family="Arial" font-size="13" fill="#475569">All findings → ingestion</text><text x="458" y="227" font-family="Arial" font-size="13" fill="#475569">Active new high/critical → SNS</text><path d="M325,202 L440,202" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="155" width="290" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="860" y="155" width="6" height="94" rx="3" fill="#2563eb"/><text x="878" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">SNS alerts</text><text x="878" y="208" font-family="Arial" font-size="13" fill="#475569">Confirmed recipient required</text><text x="878" y="227" font-family="Arial" font-size="13" fill="#475569">Separate notification match</text><path d="M740,202 L860,202" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="310" width="800" height="260" rx="12" fill="#e8eef6" stroke="#c2d0df" stroke-dasharray="6 4"/><text x="366" y="336" font-family="Arial" font-size="14" fill="#24445f" text-anchor="start">PRIVATE VPC  |  TWO AZs  |  NO NAT / PUBLIC SEARCH</text><rect x="375" y="360" width="270" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="375" y="360" width="6" height="94" rx="3" fill="#2563eb"/><text x="393" y="389" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Ingestion Lambda</text><text x="393" y="413" font-family="Arial" font-size="13" fill="#475569">Validate + normalize</text><text x="393" y="432" font-family="Arial" font-size="13" fill="#475569">Stable version-specific IDs</text><rect x="790" y="360" width="335" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="790" y="360" width="6" height="94" rx="3" fill="#2563eb"/><text x="808" y="389" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Private OpenSearch</text><text x="808" y="413" font-family="Arial" font-size="13" fill="#475569">SigV4 document PUT only</text><text x="808" y="432" font-family="Arial" font-size="13" fill="#475569">TLS + encrypted data/nodes</text><path d="M645,407 L790,407" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="717.5" y="397.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">2. index</text><rect x="40" y="460" width="285" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="460" width="6" height="94" rx="3" fill="#0f766e"/><text x="58" y="489" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Private S3 archive</text><text x="58" y="513" font-family="Arial" font-size="13" fill="#475569">1. raw finding version</text><text x="58" y="532" font-family="Arial" font-size="13" fill="#475569">Versioned; scoped endpoint</text><path d="M375,420 L325,490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M585,249 L510,360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="547.5" y="294.5" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">invoke</text><rect x="40" y="635" width="320" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="635" width="6" height="94" rx="3" fill="#7c3aed"/><text x="58" y="664" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">CloudTrail audit</text><text x="58" y="688" font-family="Arial" font-size="13" fill="#475569">Management events → S3 + Logs</text><text x="58" y="707" font-family="Arial" font-size="13" fill="#475569">Independent audit stream</text><rect x="440" y="635" width="320" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="440" y="635" width="6" height="94" rx="3" fill="#b91c1c"/><text x="458" y="664" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Delivery DLQ</text><text x="458" y="688" font-family="Arial" font-size="13" fill="#475569">EventBridge handoff failed</text><text x="458" y="707" font-family="Arial" font-size="13" fill="#475569">14-day queue retention</text><rect x="840" y="635" width="310" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="840" y="635" width="6" height="94" rx="3" fill="#b91c1c"/><text x="858" y="664" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Processing DLQ</text><text x="858" y="688" font-family="Arial" font-size="13" fill="#475569">Lambda retries exhausted</text><text x="858" y="707" font-family="Arial" font-size="13" fill="#475569">Inspect payload, repair, replay</text><text x="40" y="790" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">Private analyst search access is a separate reviewed extension. Direct Lambda tests do not prove EventBridge/SNS delivery.</text></svg>