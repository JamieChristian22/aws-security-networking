<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1200" height="795" fill="#f4f7fb"/><rect width="1200" height="112" fill="#102238"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="bold">04  AUTHENTICATED REQUEST API</text><text x="40" y="82" fill="#a9c6df" font-family="Arial" font-size="15">Public authentication boundary and private data path | POST /sandbox/requests</text><rect x="40" y="155" width="280" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="155" width="6" height="94" rx="3" fill="#7c3aed"/><text x="58" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Cognito user pool</text><text x="58" y="208" font-family="Arial" font-size="13" fill="#475569">Admin-provisioned users</text><text x="58" y="227" font-family="Arial" font-size="13" fill="#475569">SRP login + TOTP MFA</text><rect x="450" y="155" width="285" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="450" y="155" width="6" height="94" rx="3" fill="#c2410c"/><text x="468" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">API Gateway + WAF</text><text x="468" y="208" font-family="Arial" font-size="13" fill="#475569">Cognito ID-token authorizer</text><text x="468" y="227" font-family="Arial" font-size="13" fill="#475569">Managed rules + rate controls</text><path d="M320,202 L450,202" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="385.0" y="192.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">identity</text><rect x="870" y="155" width="280" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="870" y="155" width="6" height="94" rx="3" fill="#c2410c"/><text x="888" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Client request</text><text x="888" y="208" font-family="Arial" font-size="13" fill="#475569">JSON + Idempotency-Key</text><text x="888" y="227" font-family="Arial" font-size="13" fill="#475569">No secrets in logs</text><path d="M870,202 L735,202" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="802.5" y="192.0" font-family="Arial" font-size="12" fill="#475569" text-anchor="middle">POST</text><rect x="40" y="330" width="1110" height="245" rx="12" fill="#e8eef6" stroke="#c2d0df" stroke-dasharray="6 4"/><text x="56" y="356" font-family="Arial" font-size="14" fill="#24445f" text-anchor="start">PRIVATE VPC  |  NO INTERNET EGRESS</text><rect x="65" y="385" width="300" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="65" y="385" width="6" height="94" rx="3" fill="#c2410c"/><text x="83" y="414" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Lambda validation</text><text x="83" y="438" font-family="Arial" font-size="13" fill="#475569">Types, fields, action and size</text><text x="83" y="457" font-family="Arial" font-size="13" fill="#475569">Owner from verified subject</text><rect x="450" y="385" width="275" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="450" y="385" width="6" height="94" rx="3" fill="#c2410c"/><text x="468" y="414" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Gateway endpoint</text><text x="468" y="438" font-family="Arial" font-size="13" fill="#475569">Scoped role + table policy</text><text x="468" y="457" font-family="Arial" font-size="13" fill="#475569">Regional DynamoDB prefix</text><rect x="810" y="385" width="315" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="810" y="385" width="6" height="94" rx="3" fill="#0f766e"/><text x="828" y="414" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">DynamoDB table</text><text x="828" y="438" font-family="Arial" font-size="13" fill="#475569">Conditional write + replay check</text><text x="828" y="457" font-family="Arial" font-size="13" fill="#475569">KMS • PITR • deletion protection</text><path d="M590,249 L215,385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M365,432 L450,432" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M725,432 L810,432" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="545" font-family="Arial" font-size="14" fill="#475569" text-anchor="start">Idempotency identity = hash(verified subject + client key). Changed content with the same key returns 409.</text><rect x="40" y="620" width="1110" height="90" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="620" width="6" height="90" rx="3" fill="#2563eb"/><text x="58" y="649" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Operational evidence</text><text x="58" y="673" font-family="Arial" font-size="13" fill="#475569">API access + redacted WAF logs • Lambda error/throttle alarms • controlled restore-and-cutover drill</text><text x="40" y="760" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">No frontend is included. A Cognito SRP-capable client is required to complete login and MFA enrollment.</text></svg>