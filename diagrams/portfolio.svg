<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1200" height="740" fill="#f4f7fb"/><rect width="1200" height="112" fill="#102238"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="bold">AWS SECURITY &amp; NETWORKING</text><text x="40" y="82" fill="#a9c6df" font-family="Arial" font-size="15">Four independent sandbox implementations | explicit controls, testable behavior, honest evidence</text><rect x="40" y="150" width="540" height="116" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="150" width="6" height="116" rx="3" fill="#0f766e"/><text x="58" y="179" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">01  NETWORK CORE</text><text x="58" y="203" font-family="Arial" font-size="13" fill="#475569">Three isolated spoke VPCs and two-AZ inspected egress</text><text x="58" y="222" font-family="Arial" font-size="13" fill="#475569">TGW blackholes • stateful firewall • AZ-matched NAT</text><rect x="620" y="150" width="540" height="116" rx="10" fill="white" stroke="#cbd5e1"/><rect x="620" y="150" width="6" height="116" rx="3" fill="#7c3aed"/><text x="638" y="179" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">02  IDENTITY GUARDRAILS</text><text x="638" y="203" font-family="Arial" font-size="13" fill="#475569">Bounded operator roles and separate MFA emergency trust</text><text x="638" y="222" font-family="Arial" font-size="13" fill="#475569">Explicit principals • policy boundaries • CloudTrail alerts</text><rect x="40" y="300" width="540" height="116" rx="10" fill="white" stroke="#cbd5e1"/><rect x="40" y="300" width="6" height="116" rx="3" fill="#2563eb"/><text x="58" y="329" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">03  DETECTION PIPELINE</text><text x="58" y="353" font-family="Arial" font-size="13" fill="#475569">Security Hub → archive-first ingestion → private OpenSearch</text><text x="58" y="372" font-family="Arial" font-size="13" fill="#475569">SigV4 • deterministic version IDs • retry queues</text><rect x="620" y="300" width="540" height="116" rx="10" fill="white" stroke="#cbd5e1"/><rect x="620" y="300" width="6" height="116" rx="3" fill="#c2410c"/><text x="638" y="329" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">04  SECURE REQUEST API</text><text x="638" y="353" font-family="Arial" font-size="13" fill="#475569">Cognito + WAF → private Lambda → DynamoDB</text><text x="638" y="372" font-family="Arial" font-size="13" fill="#475569">Typed input • user-scoped idempotency • PITR</text><rect x="40" y="458" width="1120" height="180" rx="12" fill="#e8eef6" stroke="#c2d0df" stroke-dasharray="6 4"/><text x="56" y="484" font-family="Arial" font-size="14" fill="#24445f" text-anchor="start">SHARED ENGINEERING STANDARD</text><rect x="60" y="510" width="330" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="60" y="510" width="6" height="94" rx="3" fill="#0f766e"/><text x="78" y="539" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Implementation</text><text x="78" y="563" font-family="Arial" font-size="13" fill="#475569">One Terraform root per project</text><text x="78" y="582" font-family="Arial" font-size="13" fill="#475569">Pinned provider dependency locks</text><rect x="435" y="510" width="330" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="435" y="510" width="6" height="94" rx="3" fill="#0f766e"/><text x="453" y="539" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Validation</text><text x="453" y="563" font-family="Arial" font-size="13" fill="#475569">Offline behavior + control tests</text><text x="453" y="582" font-family="Arial" font-size="13" fill="#475569">Provider and live release gates</text><rect x="810" y="510" width="330" height="94" rx="10" fill="white" stroke="#cbd5e1"/><rect x="810" y="510" width="6" height="94" rx="3" fill="#0f766e"/><text x="828" y="539" font-family="Arial" font-size="17" font-weight="bold" fill="#102238">Operations</text><text x="828" y="563" font-family="Arial" font-size="13" fill="#475569">Runbooks, risks and recovery</text><text x="828" y="582" font-family="Arial" font-size="13" fill="#475569">Acceptance ledger and evidence</text><text x="40" y="705" font-family="Arial" font-size="13" fill="#475569" text-anchor="start">Scope: single-account laboratories. Provider validation and live AWS acceptance remain explicit pending gates.</text></svg>